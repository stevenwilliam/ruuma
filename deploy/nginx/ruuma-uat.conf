# ruuma — UAT on the local network.
#
# Mirrors the production block in docs/14 §nginx, with three differences that
# only make sense while testing on a LAN:
#
#   * default_server + `server_name _` so testers can use the bare IP
#     (http://192.168.88.101/) without any DNS or hosts-file entry.
#   * one server block, not two. Production splits admin onto admin.ruuma.id;
#     on an IP there is no second hostname to split onto, so /admin is reached
#     as a path on the same origin.
#   * plain HTTP, no certbot. The SPA carries its JWT in an Authorization
#     header from localStorage (web/src/lib/api.ts) rather than a cookie, so
#     nothing depends on Secure-flag semantics. Anyone on the LAN can still
#     read the traffic — this is for UAT, never for real customer data.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/ruuma/web;
    index index.html;

    client_max_body_size 8m;   # payment proofs and menu photos

    access_log /var/log/nginx/ruuma-uat.access.log;
    error_log  /var/log/nginx/ruuma-uat.error.log;

    # ^~ so the static-asset regex below cannot hijack an API path that
    # happens to end in .js or .css and turn it into a 404.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health { proxy_pass http://127.0.0.1:8080/health; }

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached. It is the only file with a stable name —
    # everything else carries a content hash — so a cached copy keeps pointing
    # at asset hashes that the next `make uat` deletes, and the tester gets a
    # blank page until they clear their cache. Served fresh, the 30d immutable
    # policy above is safe precisely because those names change per build.
    # No `expires -1` here: it emits its own Cache-Control: no-cache, which
    # would leave two conflicting Cache-Control values on the response.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Single-page app: unknown paths render the app, not a 404.
    location / { try_files $uri $uri/ /index.html; }
}
